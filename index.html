<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mountain Run</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #f5c518;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    header {
      padding: 24px 16px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: 0.02em;
    }
    header h1 span { color: var(--accent); }
    header p { margin: 8px 0 0; color: var(--muted); }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }
    figure { margin: 0; }
    figure + figure { margin-top: 48px; }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    figcaption {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }
    footer {
      text-align: center;
      padding: 24px 16px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mountain <span>Run</span></h1>
    <p>Two sports cars, from the mountains to the city.</p>
  </header>
  <main>
    <figure>
      <img src="image1.avif" width="1200" height="675"
           alt="Yellow sports car with a rear wing parked on a mountain road high above the clouds">
      <figcaption>Taking the high road.</figcaption>
    </figure>
    <figure>
      <img src="2024-mazda-mx-5-miata-red-white-in-motion-65b3c9d045b5a.avif" width="1200" height="678"
           alt="Red 2024 Mazda MX-5 Miata driving through a city street" loading="lazy">
      <figcaption>2024 Mazda MX-5 Miata in the city.</figcaption>
    </figure>
  </main>
  <footer>Advanture</footer>
</body>
</html>
